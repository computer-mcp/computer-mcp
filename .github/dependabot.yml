version: 2
updates:
  - package-ecosystem: swift
    directory: /Tools/Validation
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /Tools/Brand
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
