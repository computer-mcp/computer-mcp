name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.4-noble
      # Owned process groups finish only once PID 1 reaps their orphaned members.
      options: --init
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SQLite headers and test tools
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3 zsh
      - name: Build neutral targets
        run: swift build
      - name: Test neutral targets
        run: swift test --no-parallel

  dependency-gate:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify version advancement
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          python3 Scripts/version.py check
          if [[ "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ && "$BASE_COMMIT" != 0000000000000000000000000000000000000000 ]]; then
            python3 Scripts/version.py check --base "$BASE_COMMIT"
          fi

  validate:
    needs: dependency-gate
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gate tooling
        run: brew install actionlint jq ripgrep
      - name: Shared release checks
        run: python3 Scripts/release.py run --run ci --profile ci
      - name: Preserve check report and failure history
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: check-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .agent/releases/ci/history/
            .agent/releases/ci/logs/
          include-hidden-files: true
          if-no-files-found: warn

  brand:
    uses: computer-mcp/.github/.github/workflows/brand-check.yml@f402911abcdfb87ef0c41a2759e8c51387b18935 # master
