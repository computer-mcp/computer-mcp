name: Candidate
run-name: Computer MCP candidate ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation identity generated by Scripts/release.py
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

jobs:
  verify:
    name: Verify trusted candidate source
    if: github.repository == 'computer-mcp/computer-mcp' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate source
        run: Scripts/verify-candidate-ref.sh
      - name: Install gate tooling
        run: brew install actionlint jq ripgrep
      - name: Shared candidate checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/release.py run --run candidate-checks --profile source --reuse-ci

  release:
    name: Sign, notarize and preserve candidate
    needs: verify
    if: github.repository == 'computer-mcp/computer-mcp' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout trusted candidate commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck candidate source before signing
        run: Scripts/verify-candidate-ref.sh

      - name: Verify trusted runner tooling
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/grep
          /usr/bin/jq --version
          /usr/bin/security help >/dev/null
          xcrun notarytool --version

      - name: Validate protected release configuration
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_SIGNING_IDENTITY }}
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for variable in \
            APPLE_TEAM_ID \
            SIGNING_IDENTITY \
            P12_BASE64 \
            P12_PASSWORD \
            PROFILE_BASE64 \
            API_KEY_BASE64 \
            API_KEY_ID \
            API_ISSUER_ID
          do
            [[ -n "${!variable}" ]] || {
              echo "Missing protected release value: $variable" >&2
              exit 1
            }
          done
          [[ "$SIGNING_IDENTITY" == Developer\ ID\ Application:* ]] || {
            echo "DEVELOPER_ID_SIGNING_IDENTITY is not a Developer ID Application identity." >&2
            exit 1
          }

      - name: Import ephemeral Apple signing assets
        shell: bash
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          certificate_path="$RUNNER_TEMP/computer-mcp-developer-id.p12"
          profile_path="$RUNNER_TEMP/computer-mcp-developer-id.provisionprofile"
          api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/computer-mcp-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -hex 32)"

          printf '%s' "$P12_BASE64" | /usr/bin/base64 -D >"$certificate_path"
          printf '%s' "$PROFILE_BASE64" | /usr/bin/base64 -D >"$profile_path"
          printf '%s' "$API_KEY_BASE64" | /usr/bin/base64 -D >"$api_key_path"
          chmod 600 "$certificate_path" "$profile_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F "\"$SIGNING_IDENTITY\"" >/dev/null

          {
            echo "SIGNING_KEYCHAIN_PATH=$keychain_path"
            echo "PROVISIONING_PROFILE=$profile_path"
            echo "ASC_API_KEY_PATH=$api_key_path"
            echo "ASC_API_KEY_ID=$API_KEY_ID"
            echo "ASC_API_ISSUER_ID=$API_ISSUER_ID"
          } >>"$GITHUB_ENV"

      - name: Build, sign, notarize, and verify release
        env:
          EXPECTED_GITHUB_REPOSITORY: computer-mcp/computer-mcp
          EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_SIGNING_IDENTITY }}
        run: Scripts/release-ci.sh

      - name: Preserve immutable signed candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: computer-mcp-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent/candidate/candidate.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral Apple signing assets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain \
            "$RUNNER_TEMP/computer-mcp-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/computer-mcp-developer-id.p12" \
            "$RUNNER_TEMP/computer-mcp-developer-id.provisionprofile" \
            "$RUNNER_TEMP"/AuthKey_*.p8
