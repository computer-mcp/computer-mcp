name: Tag Release Gate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

jobs:
  verify:
    name: Verify release ref
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install gate tooling
        run: brew install jq ripgrep

      - name: Verify signed annotated tag and release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          verification_ref="refs/release-verification/$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:$verification_ref"
          [[ "$(git cat-file -t "$verification_ref")" == tag ]]
          [[ "$(git rev-parse "$verification_ref^{}")" == "$GITHUB_SHA" ]]
          git config gpg.ssh.allowedSignersFile .github/signing-allowed-signers
          git verify-tag "$verification_ref"

          source_version=$(sed -n \
            's/^[[:space:]]*package static let version = "\([^"]*\)"[[:space:]]*$/\1/p' \
            Sources/ComputerMCP/ComputerMCPCLI.swift)
          app_version=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            Resources/ComputerMCPApp/Info.plist)
          [[ "$version" == "$source_version" ]]
          [[ "$version" == "$app_version" ]]
          rg -q "^## $version — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md

          python3 - <<'PY'
          from pathlib import Path

          lines = Path("CHANGELOG.md").read_text().splitlines()
          start = lines.index("## Unreleased") + 1
          end = next(
              (index for index in range(start, len(lines)) if lines[index].startswith("## ")),
              len(lines),
          )
          if any(line.strip() for line in lines[start:end]):
              raise SystemExit("Unreleased must be empty on a release tag")
          PY

      - name: Repository, package, dependency, and schema gates
        run: |
          Scripts/verify-public-repository.sh
          Scripts/verify-package-boundary.sh
          Scripts/verify-swift-codex-release-gate.sh
          Scripts/verify-naming.sh

      - name: Strict Swift format
        run: |
          xcrun swift-format lint --strict --recursive --configuration .swift-format \
            Package.swift Sources Tests
          xcrun swift-format lint --strict --recursive --configuration .swift-format \
            Tools/Validation/Package.swift \
            Tools/Validation/Sources \
            Tools/Validation/Tests

      - name: Root build and test
        run: |
          /usr/bin/swift build --build-system native
          /usr/bin/swift test --build-system native --no-parallel

      - name: Validation build, test, and catalog
        run: |
          /usr/bin/swift build --build-system native --package-path Tools/Validation
          /usr/bin/swift test --build-system native --package-path Tools/Validation \
            --no-parallel
          /usr/bin/swift run --build-system native \
            --package-path Tools/Validation \
            computer-mcp-validate test-case validate

      - name: CLI, DocC, and release metadata gates
        run: |
          Scripts/verify-cli-interface.sh
          Scripts/verify-release-metadata.sh
          Scripts/verify-documentation.sh

      - name: Development Universal 2 distribution gate
        run: |
          Scripts/build-app.sh
          Scripts/package-dmg.sh
          Scripts/verify-distribution.sh
