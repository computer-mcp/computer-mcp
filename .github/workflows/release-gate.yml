name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  RELEASE_BRANCH: master

jobs:
  verify:
    name: Verify signed release tag
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout signed tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore annotated tag object
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: Scripts/restore-release-tag.sh

      - name: Install gate tooling
        run: brew install actionlint jq ripgrep

      - name: Verify release ref and final records
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REQUIRE_REMOTE_BRANCH: "1"
        run: |
          Scripts/verify-release-ref.sh
          Scripts/verify-release-readiness.sh

      - name: Repository, package, dependency, and schema gates
        run: |
          Scripts/verify-public-repository.sh
          Scripts/verify-package-boundary.sh
          Scripts/verify-swift-codex-release-gate.sh
          Scripts/verify-naming.sh

      - name: Strict Swift format
        run: |
          xcrun swift-format lint --strict --recursive --configuration .swift-format \
            Package.swift Sources Tests
          xcrun swift-format lint --strict --recursive --configuration .swift-format \
            Tools/Validation/Package.swift \
            Tools/Validation/Sources \
            Tools/Validation/Tests

      - name: Shell workflow syntax
        run: |
          zsh -n Scripts/*.sh
          actionlint .github/workflows/*.yml
          Scripts/verify-protected-release-boundary.sh
          Scripts/verify-protected-release-boundary-regression.sh
          Scripts/verify-dmg-signing-boundary-regression.sh
          Scripts/verify-developer-id-signature-record-regression.sh
          Scripts/verify-notarization-record-regression.sh
          Scripts/verify-release-tag-restoration.sh
          Scripts/verify-release-record-rendering.sh

      - name: Root build and test
        run: |
          /usr/bin/swift build --build-system native
          /usr/bin/swift test --build-system native --no-parallel

      - name: Validation build, test, and catalog
        run: |
          /usr/bin/swift build --build-system native --package-path Tools/Validation
          /usr/bin/swift test --build-system native --package-path Tools/Validation \
            --no-parallel
          /usr/bin/swift run --build-system native \
            --package-path Tools/Validation \
            computer-mcp-validate test-case validate

      - name: CLI, examples, localization, DocC, and release metadata gates
        run: |
          Scripts/verify-cli-interface.sh
          Scripts/verify-examples.sh
          Scripts/verify-localization.sh
          Scripts/verify-release-metadata.sh
          Scripts/verify-documentation.sh

      - name: Development distribution rehearsal
        env:
          ADHOC_SIGNING: "1"
        run: |
          Scripts/build-app.sh
          Scripts/package-dmg.sh
          Scripts/verify-distribution.sh

  release:
    name: Sign, notarize, and draft release
    needs: verify
    runs-on: macos-26
    timeout-minutes: 120
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout signed tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore annotated tag object
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: Scripts/restore-release-tag.sh

      - name: Verify trusted runner tooling
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/grep
          /usr/bin/jq --version
          /usr/bin/security help >/dev/null
          xcrun notarytool --version

      - name: Validate protected release configuration
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_SIGNING_IDENTITY }}
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for variable in \
            APPLE_TEAM_ID \
            SIGNING_IDENTITY \
            P12_BASE64 \
            P12_PASSWORD \
            PROFILE_BASE64 \
            API_KEY_BASE64 \
            API_KEY_ID \
            API_ISSUER_ID
          do
            [[ -n "${!variable}" ]] || {
              echo "Missing protected release value: $variable" >&2
              exit 1
            }
          done
          [[ "$SIGNING_IDENTITY" == Developer\ ID\ Application:* ]] || {
            echo "DEVELOPER_ID_SIGNING_IDENTITY is not a Developer ID Application identity." >&2
            exit 1
          }

      - name: Import ephemeral Apple signing assets
        shell: bash
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          certificate_path="$RUNNER_TEMP/computer-mcp-developer-id.p12"
          profile_path="$RUNNER_TEMP/computer-mcp-developer-id.provisionprofile"
          api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/computer-mcp-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -hex 32)"

          printf '%s' "$P12_BASE64" | /usr/bin/base64 -D >"$certificate_path"
          printf '%s' "$PROFILE_BASE64" | /usr/bin/base64 -D >"$profile_path"
          printf '%s' "$API_KEY_BASE64" | /usr/bin/base64 -D >"$api_key_path"
          chmod 600 "$certificate_path" "$profile_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F "\"$SIGNING_IDENTITY\"" >/dev/null

          {
            echo "SIGNING_KEYCHAIN_PATH=$keychain_path"
            echo "PROVISIONING_PROFILE=$profile_path"
            echo "ASC_API_KEY_PATH=$api_key_path"
            echo "ASC_API_KEY_ID=$API_KEY_ID"
            echo "ASC_API_ISSUER_ID=$API_ISSUER_ID"
          } >>"$GITHUB_ENV"

      - name: Build, sign, notarize, and verify release
        env:
          EXPECTED_GITHUB_REPOSITORY: computer-mcp/computer-mcp
          EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_SIGNING_IDENTITY }}
        run: Scripts/release-ci.sh

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="dist/Computer-MCP-${version}-ReleaseNotes.md"
          assets=()
          while read -r digest filename; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            [[ "$filename" != */* && -f "dist/$filename" ]]
            assets+=("dist/$filename")
          done <dist/SHA256SUMS
          [[ ${#assets[@]} -ge 6 ]]
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $GITHUB_REF_NAME." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --title "Computer MCP $version" \
            --notes-file "$notes" \
            "${assets[@]}" \
            dist/SHA256SUMS

      - name: Remove ephemeral Apple signing assets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain \
            "$RUNNER_TEMP/computer-mcp-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/computer-mcp-developer-id.p12" \
            "$RUNNER_TEMP/computer-mcp-developer-id.provisionprofile" \
            "$RUNNER_TEMP"/AuthKey_*.p8
