schema_version = 1

[server]
name = "computer-mcp-chatgpt-operate"

[runtime]
caller = "secure-tunnel"
profile = "chatgpt-operate"
project_id = "computer-mcp"

[policy]
default_timeout_ms = 30000
max_output_bytes = 1048576
shell_enabled = false

[[projects]]
id = "computer-mcp"
display_name = "Computer MCP"
path = ".."

[[profiles]]
id = "chatgpt-operate"
full_access = false
allowed_callers = ["secure-tunnel"]

[profiles.permissions]
screen = "allow"
desktop-control = "allow"

[profiles.projects]
"computer-mcp" = { access = "read", network = "none" }

[builtin]
enabled = []
