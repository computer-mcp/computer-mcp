schema_version = 1

[server]
name = "computer-mcp-chatgpt-tunnel"

[runtime]
caller = "secure-tunnel"
profile = "chatgpt-observe"

# Secure MCP Tunnel owns remote transport authorization. This stdio profile
# intentionally has no HTTP OAuth or bearer-token configuration, so tools
# advertise no additional inner authentication inside the private
# OpenAI-managed tunnel.

[policy]
default_timeout_ms = 30000
max_output_bytes = 1048576
shell_enabled = false

[skills]
enabled = true
max_bytes_per_skill = 1048576

[[skills.roots]]
id = "project-skills"
path = "../Skills"
description = "Optional repository-local skills directory."

# ChatGPT Pro-compatible tunnel profile:
# - no CLI, process, downstream MCP, shell, or write capabilities
# - read-only skills, file/search/system/macOS and Computer Use observation
# - standard MCP annotations mark every exposed tool read-only

[builtin]
enabled = ["project.info", "project.status", "project.manifests", "project.recent_files", "project.directory_stats", "project.artifact_directories", "project.empty_directories", "project.file_types", "project.large_files", "project.symlinks", "project.executable_files", "project.todos", "project.env_files", "project.dependency_files", "project.project_roots", "project.documentation_files", "project.agent_files", "project.instructions", "project.test_files", "project.ci_files", "project.infra_files", "project.config_files", "project.ignore_files", "project.asset_files", "project.archive_files", "project.log_files", "project.data_files", "project.schema_files", "project.source_files", "project.outline", "project.commands", "system.info", "system.kernel", "system.software", "system.locale", "system.memory", "system.load", "system.cpu", "system.thermal", "system.time", "system.uptime", "system.user", "system.groups", "system.which", "system.path", "system.volumes", "network.proxy", "macos.user_directories", "macos.default_application", "macos.applications", "macos.screens", "macos.spotlight_search", "macos.running_applications", "macos.frontmost_application", "env.describe", "file.exists", "file.list", "file.tree", "file.stat", "file.permissions", "file.type", "file.count", "file.disk_usage", "file.volume_info", "file.find", "file.search", "file.timeline", "file.read", "file.read_files", "file.read_window", "file.read_lines", "file.read_context", "file.head", "file.outline", "markdown.links", "markdown.tables", "markdown.section", "markdown.frontmatter", "markdown.link_check", "file.tail", "file.hexdump", "file.xattrs", "file.metadata", "file.readlink", "file.resolve", "image.info", "pdf.info", "pdf.text", "media.info", "json.read", "jsonl.read", "toml.read", "yaml.read", "xml.read", "plist.read", "structured.get", "csv.read", "sqlite.schema", "file.hash", "file.diff", "file.compare_trees", "file.duplicates", "archive.list", "archive.read_file"]
