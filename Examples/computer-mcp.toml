schema_version = 1

[server]
name = "computer-mcp"

[runtime]
caller = "local-mcp"
profile = "local-admin"

[server.http]
host = "127.0.0.1"
port = 8765
path = "/mcp"
health_path = "/health"
public_base_url = "https://computer-mcp.example.com"
access_token_env = "COMPUTER_MCP_HTTP_ACCESS_TOKEN"
allowed_origins = ["https://chatgpt.com", "https://chat.openai.com"]

[policy]
default_timeout_ms = 30000
max_output_bytes = 1048576
shell_enabled = false

[skills]
enabled = true
max_bytes_per_skill = 1048576

[[skills.roots]]
id = "workspace-skills"
path = "../Skills"
description = "Optional repository-local skills directory."

[[cli.commands]]
id = "git"
executable = "git"
cwd = "workspace"
allow_any_args = true
risk = "workspace-write-capable"
discovery = ["help"]

[[cli.commands]]
id = "swift"
executable = "swift"
cwd = "workspace"
allow_any_args = true
risk = "workspace-write-capable"
discovery = ["help"]

[[cli.commands]]
id = "codex"
executable = "codex"
cwd = "workspace"
allow_any_args = true
risk = "workspace-write-capable"
discovery = ["help"]

[[cli.commands]]
id = "lark"
executable = "lark-cli"
cwd = "workspace"
allow_any_args = true
risk = "external-write-capable"
discovery = ["help", "schema", "dry-run"]

[cli.commands.interface]
path_style = "argv"
flag_style = "long_flags"
flag_case = "kebab"
value_style = "separate"
format_flag = "--format"
default_format = "json"
dry_run_flag = "--dry-run"

# Enable local MCP providers only after their commands are installed and
# reachable in the environment that launches computer-mcp.
#
# [[mcp.servers]]
# id = "codex"
# transport = "stdio"
# command = "codex"
# args = ["mcp-server"]
# exposure = "gateway"
# capabilities = ["tools"]
# startup_timeout_ms = 30000
# request_timeout_ms = 180000
#
# Remote MCP servers that require OAuth or bearer tokens should be enabled only
# after the gateway has matching local auth configuration.
#
# [[mcp.servers]]
# id = "figma"
# transport = "streamable_http"
# url = "https://mcp.figma.com/mcp"
# exposure = "gateway"
# capabilities = ["tools"]

